name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # publishing a release

jobs:
  build:
    # Pinned: the binary must not need a newer glibc than the Frame's (2.39).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenVR SDK
        uses: actions/checkout@v4
        with:
          repository: ValveSoftware/openvr
          ref: v2.15.6
          path: openvr-sdk

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config libcairo2-dev

      - name: Build
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENVR_DIR="$PWD/openvr-sdk/headers" \
            -DOPENVR_LIB="$PWD/openvr-sdk/lib/linuxarm64/libopenvr_api.so"
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir dist
          strip build/frame-power-notifier
          tar -czf dist/frame-power-notifier-aarch64.tar.gz -C build frame-power-notifier
          (cd dist && sha256sum frame-power-notifier-aarch64.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: frame-power-notifier-aarch64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
